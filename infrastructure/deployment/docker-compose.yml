services:
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    environment:
      - VITE_SERVER_URL=ws://server:4000
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ../../services/collaboration-server
      dockerfile: ../../infrastructure/docker/server.Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ../../services/collaboration-server:/app
      - /app/build
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
